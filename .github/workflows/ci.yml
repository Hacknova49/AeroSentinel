name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e packages/schemas -e "python[dev]"
      - run: ruff check packages python integration scripts
      - run: python -m pytest packages/schemas/tests python/tests integration/tests -q   # includes the e2e smoke test
