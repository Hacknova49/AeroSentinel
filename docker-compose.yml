services:
  db:
    image: timescale/timescaledb-ha:pg16     # includes PostGIS + TimescaleDB
    environment: { POSTGRES_PASSWORD: aerosentinel, POSTGRES_DB: aerosentinel }
    ports: ["5432:5432"]
    volumes: ["pgdata:/home/postgres/pgdata/data", "./python/src/aerosentinel/storage/migrations:/docker-entrypoint-initdb.d:ro"]
  objects:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: aerosentinel, MINIO_ROOT_PASSWORD: aerosentinel }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["objdata:/data"]
  api:
    build: .
    env_file: .env.example
    depends_on: [db, objects]
    ports: ["8000:8000"]
volumes: { pgdata: {}, objdata: {} }
